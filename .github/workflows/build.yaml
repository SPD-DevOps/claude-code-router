name: Docker Build Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Set environment"
        required: true
        type: string
      run-environment:
        description: "Build environment"
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
    outputs:
      image-tag:
        description: "Docker tag image"
        value: ${{ jobs.build-image.outputs.image-tag }}

jobs:
  build-image:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    outputs:
      image-tag: ${{ steps.image-tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set Tag
        run: |
          echo "image_tag=${{ inputs.environment }}-$(git log | head -n 1 | cut -c8-15)" >> $GITHUB_ENV
          source $GITHUB_ENV
          echo "image_full_tag=$(echo "ghcr.io/${{ github.repository }}:$image_tag" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "repository_lowercase=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          source $GITHUB_ENV
          echo "Image Tag: $image_tag"
          echo "::set-output name=image-tag::$image_tag"
          echo "Image Full Tag: $image_full_tag"
          echo "::set-output name=image-full-tag::$image_full_tag"

        id: image-tag

      - name: Build Image
        run: |
          docker image build -t ${{ env.image_full_tag }} .
          docker image tag ${{ env.image_full_tag }} ghcr.io/${{ env.repository_lowercase }}:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_PAT }}

      - name: Push Docker image
        run: |
          docker push ${{ env.image_full_tag }}
          docker push ghcr.io/${{ env.repository_lowercase }}:latest
